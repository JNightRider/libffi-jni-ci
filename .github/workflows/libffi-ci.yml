---
# GitHub Actions workflow for commits pushed to the LibFFI-JNI CI repo - all branches

name: LibFFI-JNI CI
on:
  workflow_dispatch:

env:
  FFI_VERSION: v3.8.0
  VERSION: 0.1.0

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ARCH: [arm64-v8a, armeabi-v7a, riscv64, x86, x86_64]
        include:
          - ARCH: arm64-v8a
            TYPE: android
            HOST: aarch64-linux-android
            TRIPLET: aarch64-linux-android
            # windows=windows-x86_64, macOs=[darwin-arm64, arwin-x86_64], linux=linux-x86_64
            TOOLCHAIN: linux-x86_64
            API_LEVEL: 35
          - ARCH: armeabi-v7a
            TYPE: androideabi
            HOST: arm-linux-androideabi
            TRIPLET: armv7a-linux-androideabi
            TOOLCHAIN: linux-x86_64
            API_LEVEL: 35
          - ARCH: riscv64
            TYPE: android
            HOST: riscv64-linux-android
            TRIPLET: riscv64-linux-android
            TOOLCHAIN: linux-x86_64
            API_LEVEL: 35
          - ARCH: x86
            TYPE: android
            HOST: i686-linux-android
            TRIPLET: i686-linux-android
            TOOLCHAIN: linux-x86_64
            API_LEVEL: 35
          - ARCH: x86_64
            TYPE: android
            HOST: x86_64-linux-android
            TRIPLET: x86_64-linux-android
            TOOLCHAIN: linux-x86_64
            API_LEVEL: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq install m4 make autoconf automake libtool libltdl-dev texinfo git
      - name: Clone repository
        run: git clone --depth 3 --branch ${{ env.FFI_VERSION }} https://github.com/libffi/libffi.git .
      - name: Configure build
        run: |
          export TOOLCHAIN="${ANDROID_NDK_ROOT}"/toolchains/llvm/prebuilt/${{ matrix.TOOLCHAIN }}
          export CC="${TOOLCHAIN}"/bin/${{ matrix.TRIPLET }}${{ matrix.API_LEVEL }}-clang
          export CXX="${TOOLCHAIN}"/bin/${{ matrix.TRIPLET }}${{ matrix.API_LEVEL }}-clang++
          export CC_FOR_TARGET="${TOOLCHAIN}"/bin/${{ matrix.TRIPLET }}${{ matrix.API_LEVEL }}-clang
          export CXX_FOR_TARGET="${TOOLCHAIN}"/bin/${{ matrix.TRIPLET }}${{ matrix.API_LEVEL }}-clang++
          export LD="${TOOLCHAIN}"/bin/ld.lld
          export AR="${TOOLCHAIN}"/bin/llvm-ar
          export AS="${CC}"
          export RANLIB="${TOOLCHAIN}"/bin/llvm-ranlib
          export STRIP="${TOOLCHAIN}"/bin/llvm-strip
          export NM="${TOOLCHAIN}"/bin/llvm-nm
          export OBJDUMP="${TOOLCHAIN}"/bin/llvm-objdump

          ./autogen.sh
          ./configure --disable-shared --with-pic --host=${{matrix.HOST}} || (cat */config.log ; exit 1)
      - name: Build
        run: make
      - name: Package artifact
        run: |
          ls ${{ matrix.ARCH }}-unknown-linux-${{ matrix.TYPE }}
          

