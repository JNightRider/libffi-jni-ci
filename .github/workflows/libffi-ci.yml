  Freebsd-Cross:
    name: FreeBSD Cross
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ARCH: [ x64 ]
        include:
          - ARCH: x64
            VM_ARCH: x86-64
            VERSION: '14.4'
    steps:
      - name: Start VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          architecture: ${{ matrix.VM_ARCH }}
          version: ${{ matrix.VERSION }}
          memory: 4G
      - name: Install dependencies
        shell: cpa.sh {0}
        run: sudo pkg install -y m4 gmake automake libtool texinfo git
      - name: Clone repository
        run: git clone --depth 3 --branch ${{ env.FFI_VERSION }} https://github.com/libffi/libffi.git .
      - name: Configure build
        shell: cpa.sh {0}
        run: |
          ./autogen.sh
          ./configure --disable-shared --with-pic
      - name: Print config failure
        run: cat */config.log
        if: failure()
      - name: Build
        shell: cpa.sh {0}
        run: make
      - name: Package artifact
        run: |
          PKG=libffi-${{ env.VERSION }}-linux-${{ matrix.ARCH }}

          mkdir -p "$PKG/include"
          mkdir -p "$PKG/lib"

          ls
          cp LICENSE "$PKG/"
          cp ${{ matrix.HOST }}/include/*.h "$PKG/include/"
          cp ${{ matrix.HOST }}/.libs/libffi_convenience.a "$PKG/lib/libffi.a"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libffi-${{ env.VERSION }}-linux-${{ matrix.ARCH }}
          path: libffi-${{ env.VERSION }}-linux-${{ matrix.ARCH }}